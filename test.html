<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>📚 TKB Năm học 2026-2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdfbf7;
            background-image: 
                linear-gradient(#e8e8e8 1px, transparent 1px),
                linear-gradient(90deg, #e8e8e8 1px, transparent 1px);
            background-size: 20px 20px;
            color: #444;
            padding: 10px;
            line-height: 1.5;
            text-align: center;
        }

        .container { max-width: 100%; margin: 0 auto; }

        .header {
            margin-bottom: 20px;
            padding: 15px 10px;
            background: #ffffff;
            border-radius: 12px;
            border: 2px solid #e3f2fd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .header h1 {
            color: #1565c0;
            font-size: 1.5em;
            font-weight: 800;
            margin-bottom: 5px;
        }

        /* Dòng 1: Giờ & Ngày */
        .datetime-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 1em;
        }
        .time-val { font-weight: 800; color: #e65100; }
        .date-val { font-weight: 700; color: #333; }
        .separator { color: #ccc; }

        /* Dòng 2: Tuần & Năm học */
        .info-badges {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 700;
        }
        .badge-week { background: #fff3e0; color: #e65100; }
        .badge-year { background: #e3f2fd; color: #1565c0; }

        /* Dòng 3: Ngày cập nhật từ Sheet */
        .sheet-update-info {
            font-size: 0.85em;
            color: #666;
            font-style: italic;
            margin-top: 5px;
            min-height: 1.2em; /* Giữ chỗ tránh giật layout */
        }

        .class-section {
            margin-bottom: 25px;
            background: #ffffff;
            border-radius: 12px;
            padding: 15px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .class-title {
            font-size: 1.3em;
            font-weight: 800;
            margin-bottom: 15px;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .class-7a6 { border-top: 4px solid #f48fb1; }
        .class-7a6 .class-title { color: #c2185b; border-bottom: 2px dashed #f8bbd0; }

        .class-9a9 { border-top: 4px solid #4fc3f7; }
        .class-9a9 .class-title { color: #0277bd; border-bottom: 2px solid #b3e5fc; }

        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.85em;
            margin: 0 auto;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 4px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f5f7fa;
            color: #546e7a;
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* --- MORNING STYLES --- */
        .class-7a6 .session-morning {
            background-color: #ec407a !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-morning {
            background-color: #0288d1 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-7a6 .morning-odd td { background-color: #fce4ec; color: #880e4f; font-weight: 700; }
        .class-9a9 .morning-odd td { background-color: #e1f5fe; color: #01579b; font-weight: 700; }
        .class-7a6 .morning-even td, .class-9a9 .morning-even td { background-color: #ffffff; color: #444; font-weight: 700; }

        /* --- AFTERNOON STYLES --- */
        .class-7a6 .session-afternoon {
            background-color: #880e4f !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-afternoon {
            background-color: #01579b !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .afternoon-start td { border-top: 4px solid #546e7a !important; }
        .class-7a6 .afternoon-odd td { background-color: #f8bbd0; color: #880e4f; font-weight: 700; }
        .class-9a9 .afternoon-odd td { background-color: #b3e5fc; color: #01579b; font-weight: 700; }
        .class-7a6 .afternoon-even td, .class-9a9 .afternoon-even td { background-color: #f5f5f5; color: #444; font-weight: 700; }

        /* --- EXTRA (HỌC THÊM) STYLES --- */
        .class-7a6 .session-extra {
            background-color: #7e57c2 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .class-9a9 .session-extra {
            background-color: #5c6bc0 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95em;
        }
        .extra-start td { border-top: 4px solid #546e7a !important; }
        .class-7a6 .extra-odd td { background-color: #ede7f6; color: #4527a0; font-weight: 700; }
        .class-9a9 .extra-odd td { background-color: #e8eaf6; color: #283593; font-weight: 700; }
        .class-7a6 .extra-even td, .class-9a9 .extra-even td { background-color: #ffffff; color: #444; font-weight: 700; }

        .empty-cell { color: #bdbdbd !important; font-weight: 400 !important; }

        .current-day-header {
            background-color: #fff3e0 !important;
            color: #e65100 !important;
            border: 2px solid #ffb74d !important;
            font-weight: 800;
            position: relative;
        }
        .current-day-header::after {
            content: '📍';
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 0.9em;
            background: white;
            border-radius: 50%;
            padding: 2px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1em;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c62828;
            text-align: left;
        }

        .footer {
            margin-top: 25px;
            padding: 15px;
            color: #888;
            font-size: 0.85em;
        }

        @media (max-width: 768px) {
            body { padding: 5px; }
            .header { padding: 12px 8px; margin-bottom: 15px; }
            .header h1 { font-size: 1.2em; }
            .datetime-line { font-size: 0.9em; }
            .badge { font-size: 0.8em; padding: 3px 10px; }
            .class-section { padding: 10px 5px; margin-bottom: 20px; }
            .class-title { font-size: 1.1em; margin-bottom: 10px; }
            table { font-size: 0.7em; }
            th, td { padding: 6px 2px; }
            .footer { font-size: 0.75em; padding: 10px; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.1em; }
            table { font-size: 0.65em; }
            th, td { padding: 5px 1px; }
            .datetime-line { flex-direction: column; gap: 2px; }
            .separator { display: none; }
        }

        @media print {
            body { background: white; padding: 0; }
            .class-section, .header { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Thời Khóa Biểu</h1>
            
            <!-- Dòng 1: Giờ & Ngày -->
            <div class="datetime-line">
                <span class="time-val" id="current-time">--:--</span>
                <span class="separator">•</span>
                <span class="date-val" id="current-date">Thứ ..., ngày ...</span>
            </div>

            <!-- Dòng 2: Tuần & Năm học -->
            <div class="info-badges">
                <span class="badge badge-week">Tuần <span id="week-number">1</span></span>
                <span class="badge badge-year">Năm học 2026 - 2027</span>
            </div>

            <!-- Dòng 3: Thông tin cập nhật từ Sheet (Ô D1) -->
            <div class="sheet-update-info" id="sheet-update-text">Đang tải thông tin...</div>
        </div>

        <!-- Lớp 7A6 -->
        <div class="class-section class-7a6">
            <h2 class="class-title">🌸 Lớp 7A6</h2>
            <div class="table-wrapper">
                <div id="loading-7a6" class="loading">Đang tải dữ liệu</div>
                <table id="table-7a6" style="display: none;">
                    <thead>
                        <tr>
                            <th>Buổi</th>
                            <th>Tiết</th>
                            <th>Giờ</th>
                            <th>T2</th>
                            <th>T3</th>
                            <th>T4</th>
                            <th>T5</th>
                            <th>T6</th>
                            <th>T7</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-7a6"></tbody>
                </table>
                <div id="error-7a6" style="display: none;"></div>
            </div>
        </div>

        <!-- Lớp 9A9 -->
        <div class="class-section class-9a9">
            <h2 class="class-title">🚀 Lớp 9A9</h2>
            <div class="table-wrapper">
                <div id="loading-9a9" class="loading">Đang tải dữ liệu</div>
                <table id="table-9a9" style="display: none;">
                    <thead>
                        <tr>
                            <th>Buổi</th>
                            <th>Tiết</th>
                            <th>Giờ</th>
                            <th>T2</th>
                            <th>T3</th>
                            <th>T4</th>
                            <th>T5</th>
                            <th>T6</th>
                            <th>T7</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-9a9"></tbody>
                </table>
                <div id="error-9a9" style="display: none;"></div>
            </div>
        </div>

        <div class="footer">
            <p>🌟 MỤC TIÊU HỌC SINH XUẤT SẮC!</p>
            <p>Năm học 2026-2027</p>
        </div>
    </div>

    <script>
        // ===== 1. CẤU HÌNH GOOGLE SHEETS =====
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSPcpB9A2glEjMqqQpekznvgWJ1jcvif5rYOhTVkCbI6yrMVj7hD1wyNqXeCSyWx0Tcmc9-PlbC9LQO/pub?gid=859933321&single=true&output=csv';
        
        // ===== 2. CẤU HÌNH VÙNG DỮ LIỆU (1-based indexing) =====
        const DATA_RANGES = {
            '7a6': {
                morning:    { startRow: 4, endRow: 8,  startCol: 2, endCol: 9, label: 'Sáng' },
                afternoon:  { startRow: 9, endRow: 13, startCol: 2, endCol: 9, label: 'Chiều' },
                extra:      { startRow: 14, endRow: 15, startCol: 2, endCol: 9, label: 'Học thêm' }
            },
            '9a9': {
                morning:    { startRow: 17, endRow: 21, startCol: 2, endCol: 9, label: 'Sáng' },
                afternoon:  { startRow: 22, endRow: 26, startCol: 2, endCol: 9, label: 'Chiều' },
                extra:      { startRow: 27, endRow: 28, startCol: 2, endCol: 9, label: 'Học thêm' }
            }
        };
        
        let lastDataHash = '';

        // ===== 3. HÀM XỬ LÝ DỮ LIỆU =====
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            const result = [];
            for (let line of lines) {
                const row = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                row.push(current.trim());
                result.push(row);
            }
            return result;
        }

        function getCellValue(data, sheetRow, sheetCol) {
            const csvRow = sheetRow - 1; 
            const csvCol = sheetCol - 1; 
            if (data[csvRow] && data[csvRow][csvCol] !== undefined) {
                return data[csvRow][csvCol].trim();
            }
            return '';
        }

        function isEmpty(value) {
            return !value || value === '' || value === '-' || value === '​'; 
        }

        // ===== 4. RENDER BẢNG ĐỘNG =====
        function renderSessionBlock(ranges, sessionKey, classId, data) {
            if (!ranges[sessionKey]) return '';
            const range = ranges[sessionKey];
            const rowCount = range.endRow - range.startRow + 1;
            let html = '';
            
            for (let i = 0; i < rowCount; i++) {
                const sheetRow = range.startRow + i;
                const cells = [];
                for (let col = range.startCol; col <= range.endCol; col++) {
                    cells.push(getCellValue(data, sheetRow, col));
                }
                
                let periodClass = '';
                if (sessionKey === 'morning') periodClass = i % 2 === 0 ? 'morning-odd' : 'morning-even';
                else if (sessionKey === 'afternoon') periodClass = i % 2 === 0 ? 'afternoon-odd' : 'afternoon-even';
                else if (sessionKey === 'extra') periodClass = i % 2 === 0 ? 'extra-odd' : 'extra-even';

                const isStart = i === 0;
                let rowClass = periodClass;
                if (isStart && sessionKey === 'afternoon') rowClass += ' afternoon-start';
                if (isStart && sessionKey === 'extra') rowClass += ' extra-start';

                html += `<tr class="${rowClass}">`;
                
                if (isStart) {
                    const sessionClass = sessionKey === 'morning' ? 'session-morning' : 
                                         sessionKey === 'afternoon' ? 'session-afternoon' : 'session-extra';
                    html += `<td rowspan="${rowCount}" class="${sessionClass}">${range.label}</td>`;
                }
                
                cells.forEach(cell => {
                    html += isEmpty(cell) ? `<td class="empty-cell">-</td>` : `<td>${cell}</td>`;
                });
                html += '</tr>';
            }
            return html;
        }

        function renderClassTable(classId, data) {
            const tbody = document.getElementById(`tbody-${classId}`);
            const ranges = DATA_RANGES[classId];
            let html = '';
            
            html += renderSessionBlock(ranges, 'morning', classId, data);
            html += renderSessionBlock(ranges, 'afternoon', classId, data);
            if (ranges.extra) {
                html += renderSessionBlock(ranges, 'extra', classId, data);
            }
            
            tbody.innerHTML = html;
        }

        // ===== 5. FETCH & UPDATE =====
        async function fetchAndUpdateData() {
            try {
                const response = await fetch(SHEET_URL);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const csvText = await response.text();
                
                if (csvText !== lastDataHash) {
                    lastDataHash = csvText;
                    const data = parseCSV(csvText);
                    
                    // 1. Lấy thông tin cập nhật từ ô D1 (Dòng 1, Cột 4)
                    const updateInfo = getCellValue(data, 1, 4);
                    if (updateInfo) {
                        document.getElementById('sheet-update-text').textContent = `📅 Cập nhật ngày: ${updateInfo}`;
                    } else {
                        document.getElementById('sheet-update-text').textContent = '';
                    }

                    // 2. Render bảng
                    renderClassTable('7a6', data);
                    renderClassTable('9a9', data);
                    
                    document.getElementById('table-7a6').style.display = 'table';
                    document.getElementById('loading-7a6').style.display = 'none';
                    document.getElementById('table-9a9').style.display = 'table';
                    document.getElementById('loading-9a9').style.display = 'none';
                    
                    highlightCurrentDay(new Date().getDay());
                }
            } catch (error) {
                console.error('❌ Lỗi tải dữ liệu:', error);
                document.getElementById('loading-7a6').style.display = 'none';
                document.getElementById('loading-9a9').style.display = 'none';
                
                const errorMsg = `<div class="error-message">⚠️ Không thể tải dữ liệu.<br><small>${error.message}</small></div>`;
                document.getElementById('error-7a6').style.display = 'block';
                document.getElementById('error-7a6').innerHTML = errorMsg;
                document.getElementById('error-9a9').style.display = 'block';
                document.getElementById('error-9a9').innerHTML = errorMsg;
            }
        }

        // ===== 6. TIỆN ÍCH NGÀY GIỜ =====
        function updateDateTime() {
            const now = new Date();
            
            // Format: HH:mm:ss
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}:${seconds}`;

            // Format: Thứ ..., ngày dd/mm/yyyy
            const weekday = now.toLocaleDateString('vi-VN', { weekday: 'long' });
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();
            document.getElementById('current-date').textContent = `${weekday}, ${day}/${month}/${year}`;

            calculateSchoolWeek(now);
        }

        function calculateSchoolWeek(currentDate) {
            const startDate = new Date(2026, 8, 7); // 7/9/2026
            startDate.setHours(0, 0, 0, 0);
            
            const current = new Date(currentDate);
            const dayOfWeek = current.getDay();
            const diff = current.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            const currentMonday = new Date(current.setDate(diff));
            currentMonday.setHours(0, 0, 0, 0);
            
            const diffTime = currentMonday - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const weekNumber = Math.floor(diffDays / 7) + 1;
            
            document.getElementById('week-number').textContent = weekNumber > 0 ? weekNumber : '—';
        }

        function highlightCurrentDay(dayOfWeek) {
            if (dayOfWeek === 0) return;
            const colIndex = dayOfWeek + 2; 
            
            document.querySelectorAll('table').forEach(table => {
                table.querySelectorAll('th').forEach(th => th.classList.remove('current-day-header'));
                const headers = table.querySelectorAll('th');
                if (headers[colIndex]) {
                    headers[colIndex].classList.add('current-day-header');
                }
            });
        }

        // ===== 7. KHỞI TẠO =====
        function init() {
            fetchAndUpdateData();
            setInterval(fetchAndUpdateData, 120000); 
            
            updateDateTime();
            setInterval(updateDateTime, 1000); 
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
